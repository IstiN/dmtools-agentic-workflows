# Merge bot factory leg — REUSABLE workflow (dmtools-agentic-workflows:
# the frozen machine-loop home).
#
# Migrated from IstiN/dmtools-agents factory-merge.yml (f377609) — the
# agents-repo copy is DEPRECATED for new callers (kept only so existing
# pinned users keep resolving their historical SHA).
#
# Why: the SM tick is cron */10 and GitHub cron is BEST-EFFORT — under load
# scheduled runs silently vanish (live: fa ticks stopped for 30+ minutes
# while approved green PRs waited to merge). The merge stage needs no
# orchestration: its evidence (labels + concluded checks + mergeability)
# is fully on the PR. This workflow runs the deterministic, idempotent
# mergeBot.js on EVENTS so conclusions act within seconds:
#
#   workflow_run (the dispatched CI concluded)   — the primary trigger
#   pull_request (labeled / synchronize / edited)— latch-relevant changes
#   check_run (completed)                         — bridge mirrors conclude
#   workflow_dispatch                             — manual / watchdog nudge
#
# The bot performs ONLY: approved+validating+green+CLEAN -> squash-merge
# (one retry on transient refusals, full error surfacing); validating+
# green+CLEAN+unapproved -> latch ai_validated; validating+green+stale
# base -> unarm. Everything else stays SM-owned (no dispatches, no legs).
# Overlap with the SM's merge-validated/validated-green rules is safe:
# both sides are idempotent on the same labels; whoever runs first wins
# and the other becomes a no-op.
#
# FREEZE CONTRACT: same as factory-sm.yml — agent code resolves from the
# dmtools-agents RELEASE selected by the caller's vars.AGENTS_VERSION
# ('latest' default), the CLI from vars.DMTOOLS_VERSION. Bumping either is
# a repo-settings edit, never a workflow edit.
#
# Caller stub (machine-merge.yml in the target repo):
#   on:
#     workflow_run: {workflows: ['Quality'], types: [completed]}
#     pull_request: {types: [labeled, synchronize, edited]}
#     check_run: {types: [completed]}
#     workflow_dispatch: {}
#   jobs:
#     merge:
#       if: github.event_name != 'pull_request' || contains(github.event.label.name, 'ai_') || contains(github.event.label.name, 'pr_approved')
#       uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-merge.yml@<ref>
#       secrets:
#         SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}

name: 'Factory · Machine Merge Bot'

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (self-hosted pools must be visible to the CALLING org)'
        type: string
        default: 'ubuntu-slim'
      dry-run:
        description: "'true' to log the plan without acting (STRING — boolean-typed reusable inputs cannot take expressions)."
        required: false
        type: string
        default: 'false'
      ci_workflow:
        description: "CI workflow FILE NAME this repo dispatches on PR heads (fa: ci.yml, dart: quality.yml) — the bot's workflow-run fallback reads its runs when a head carries no check runs (API silent-updated heads, live fa #762)."
        required: false
        type: string
        default: 'ci.yml'

    secrets:
      SOURCE_GITHUB_TOKEN:
        description: 'PAT with repo scope — GitHub API access for the merge bot (labels, PR state, checks, merge).'
        required: true
      APP_ID:
        description: 'Optional GitHub App id (awf#52). With APP_PRIVATE_KEY set, every GitHub API call in the run rides a per-job App installation token (10x the PAT rate budget) instead of SOURCE_GITHUB_TOKEN. Absent => PAT, byte-identical to the pre-App behavior.'
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key (PEM) of the APP_ID GitHub App.'
        required: false
      MERGE_APP_ID:
        description: 'DEPRECATED pre-awf#52 alias of APP_ID (#46 merge identity) — still honored.'
        required: false
      MERGE_APP_PRIVATE_KEY:
        description: 'DEPRECATED pre-awf#52 alias of APP_PRIVATE_KEY — still honored.'
        required: false

# NOTE: NO concurrency block here — deliberately. A called workflow's
# concurrency NEVER applies (GitHub ignores it; only the caller's does),
# and a caller + callee sharing the SAME group name makes every run fail
# at startup with zero jobs and no annotations (live bisect 2026-09-22:
# probes D-G green without it, H red with group name collision, H1 green
# after rename). The caller stub owns the group (machine-merge-bot).

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # Version knobs resolve from the CALLER's repository variables (vars.*
  # resolve in the caller's context for reusable workflows).
  AGENTS_VERSION: ${{ vars.AGENTS_VERSION || 'latest' }}
  DMTOOLS_VERSION: ${{ vars.DMTOOLS_VERSION || 'latest' }}

jobs:
  merge:
    runs-on: ${{ inputs.runner || 'ubuntu-slim' }}
    timeout-minutes: 5
    steps:
      # awf#54: fork-PR `pull_request` events run WITHOUT repo secrets —
      # SOURCE_GITHUB_TOKEN arrives empty and the bot step would fail red on
      # a PR that the token-carrying base-context legs (workflow_run /
      # check_run) still handle in base context. Degrade to success+notice.
      - name: Fork-PR gate (secrets withheld -> skip with notice)
        id: forkgate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::fork PR context — secrets withheld; the workflow_run/check_run legs run in base context and carry the token, the merge is handled there."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout target repository
        if: steps.forkgate.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GitHub App auth (awf#52): with APP_ID + APP_PRIVATE_KEY secrets,
      # every GitHub API call below rides a per-job App installation token
      # instead of the PAT. Minted HERE, in the consuming job, because
      # GitHub strips secret-bearing job outputs (tokens cannot cross
      # jobs). Absent APP_* secrets => SOURCE_GITHUB_TOKEN (PAT),
      # byte-identical to the pre-App behavior. MERGE_APP_* stay honored
      # as the pre-awf#52 names (#46 merge identity).
      - name: Resolve GitHub auth (App -> PAT)
        if: steps.forkgate.outputs.skip != 'true'
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID || secrets.MERGE_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "auth: app"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "auth: pat"
          fi

      - name: Mint GitHub App installation token
        id: app-token
        if: steps.forkgate.outputs.skip != 'true' && steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID || secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY || secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Resolve versions (agents release + dmtools CLI)
        if: steps.forkgate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          resolve_tag() {
            local repo="$1" knob="$2"
            if [ "$knob" = "latest" ]; then
              gh api "repos/${repo}/releases/latest" --jq .tag_name
            else
              gh api "repos/${repo}/releases/tags/${knob}" --jq .tag_name
            fi
          }
          AGENTS_TAG="$(resolve_tag IstiN/dmtools-agents "$AGENTS_VERSION")"
          DMTOOLS_TAG="$(resolve_tag epam/dmtools-dart "$DMTOOLS_VERSION")"
          echo "AGENTS_TAG=${AGENTS_TAG}" >> "$GITHUB_ENV"
          echo "DMTOOLS_TAG=${DMTOOLS_TAG}" >> "$GITHUB_ENV"
          echo "agents pack release: ${AGENTS_TAG} (knob: ${AGENTS_VERSION})"
          echo "dmtools CLI release: ${DMTOOLS_TAG} (knob: ${DMTOOLS_VERSION})"

      - name: Install dmtools CLI (release bundle)
        if: steps.forkgate.outputs.skip != 'true'
        run: |
          curl -fsSL "https://github.com/epam/dmtools-dart/releases/download/${DMTOOLS_TAG}/install.sh" \
            -o /tmp/dmtools-install.sh
          bash /tmp/dmtools-install.sh "${DMTOOLS_TAG}"
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Run the merge bot
        if: steps.forkgate.outputs.skip != 'true'
        # Runs as a VERSIONED AGENT PACK (machine_merge@latest): the pack
        # carries mergeBot.js + its require() closure, sha256-verified
        # against the release catalog. CWD = target repo root (config
        # discovery parity with the old submodule checkout).
        env:
          # App installation token (awf#52, minted above — expires with
          # the job) wins; absent APP_*/MERGE_APP_* secrets =>
          # SOURCE_GITHUB_TOKEN (PAT) as before. Merge identity salvaged
          # from #35/#46.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          SOURCE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          export DMTOOLS_PACK_REGISTRY="https://github.com/IstiN/dmtools-agents/releases/download/${AGENTS_TAG}"
          repo='${{ github.repository }}'
          dry=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then dry=",\"dryRun\":true"; fi
          CIWF="${{ inputs.ci_workflow }}"
          override="{\"params\":{\"jobParams\":{\"repo\":\"${repo}\",\"ciWorkflow\":\"${CIWF}\"${dry}}}}"
          dmtools run machine_merge@latest "$override"
