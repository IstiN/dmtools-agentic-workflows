# Machine SM factory leg — REUSABLE workflow (dmtools-agentic-workflows:
# the frozen machine-loop home. GitHub requires reusable workflows at the
# .github/workflows root — no subdirectories).
#
# Migrated from IstiN/dmtools-agents factory-sm.yml (f377609) — the
# agents-repo copy is DEPRECATED for new callers (kept only so existing
# pinned users like fa keep resolving their historical SHA).
#
# FREEZE CONTRACT: target repositories carry only a thin stub (schedule +
# this call) pinned to an immutable SHA of THIS repo. Agent code and the
# dmtools CLI are NOT tied to that SHA anymore — they resolve from RELEASES
# by version knobs (repo variables of the CALLER, per-repo, no workflow
# edits to bump):
#
#   vars.AGENTS_VERSION   — dmtools-agents release tag ('latest' or e.g.
#                           'agents-rel-20260928-…'); the agent pack
#                           (sm_github, or sm_gitlab with scm-provider:
#                           gitlab) is fetched from that release's
#                           asset catalog via the dmtools registry
#                           (DMTOOLS_PACK_REGISTRY). Default: latest.
#   vars.DMTOOLS_VERSION  — dmtools-dart CLI release tag ('latest' or
#                           'vX.Y.Z'); installed from the release bundle.
#                           Default: latest.
#
# Runs in the CALLER's context: github.repository = the target repo,
# vars.* and secrets.* resolve from the caller (each target pins its own
# versions).
#
# What it does: resolves the two version knobs, installs the dmtools CLI
# (release asset, no repo file needed), then runs the SM rule engine as a
# VERSIONED AGENT PACK (dmtools run sm_github@latest, or sm_gitlab@latest)
# against the target repo's loop state — the pack carries smAgent.js + rules + engine closure,
# verified against the release's sha256 inventory.
#
# Caller stub:
#   on:
#     schedule: [{cron: '*/10 * * * *'}]
#     workflow_dispatch: {inputs: {dryRun: {type: boolean, default: true}}}
#   permissions:
#     # A reusable workflow CANNOT grant itself permissions the caller did
#     # not issue (GitHub hard rule) — the stub must pre-grant everything
#     # the SM needs:
#     #   contents: write       checkout + silent update-branch pushes
#     #   issues: write         labels + close-issue safety net
#     #   pull-requests: write  update-branch + merge
#     #   checks: write         bridge-free validation stamps
#     # NEVER add `workflows: write` — it is NOT a valid permissions scope
#     # for GITHUB_TOKEN and makes the workflow file UNPARSEABLE (live
#     # fah#1717: HTTP 422 "Unexpected value 'workflows'", SM dead until
#     # reverted). GITHUB_TOKEN can never push workflow-file changes no
#     # matter what the stub declares.
#   jobs:
#     sm:
#       uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm.yml@<ref>
#       secrets:
#         # Silent updates that carry main's workflow-file changes need a
#         # workflows-capable PAT: pass it here (the factory resolves
#         # inputs.silent-token || secrets.SILENT_GH_TOKEN || github.token;
#         # the with-input channel cannot reference secrets — 422).
#         SILENT_GH_TOKEN: ${{ secrets.PAT_TOKEN }}
#       uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm.yml@<ref>
#       with:
#         dryRun: ${{ github.event.inputs.dryRun || 'false' }}   # STRING —
#         # typed (boolean) reusable inputs reject expressions; strings take them.
#       secrets:
#         SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
#
# GitLab target (OPT-IN, scm-provider: gitlab): the same tick runs the
# sm_gitlab@latest pack against a GitLab project instead of github.repository.
# The stub still lives in a GitHub repo (it hosts .dmtools/config.js and the
# cron); SOURCE_GITHUB_TOKEN is still needed to resolve/download releases.
#   jobs:
#     sm:
#       uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm.yml@<ref>
#       with:
#         scm-provider: gitlab
#         gitlab-project: my-group/my-project     # subgroups allowed
#         gitlab-base-path: https://gitlab.example.com   # default gitlab.com
#         dryRun: ${{ github.event.inputs.dryRun || 'false' }}
#       secrets:
#         SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
#         GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
# GitHub-only lanes are off in sm_gitlab (see dmtools-agents
# docs/agents/sm_gitlab.md), so silent-token / ci-workflow /
# validation-checks / state-publish are ignored on a GitLab tick.

name: 'Factory · Machine SM'

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (self-hosted pools must be visible to the CALLING org)'
        type: string
        default: 'ubuntu-slim'
      dryRun:
        description: "'true' to log the plan without acting (STRING — boolean-typed reusable inputs cannot take expressions, live bisect probes D/E)"
        required: false
        type: string
        default: 'false'
      machine-author:
        description: "Deployment's machine (bot) login for #687 PR rules: excluded from review-external-once, gates rework re-arm in PR-anchored reviews and the SM prMachineAuthor rules (auto legs, e.g. auto rework). Global-level knob — the agents repo carries no hardcoded login."
        required: false
        type: string
        default: ''
      silent-token:
        description: "The caller's github.token for silent branch updates (#687) — pushes with it trigger no workflows. Routed as an INPUT: GitHub delivers an EMPTY value when github.token is mapped through the reusable-call secrets block (live-verified), while inputs carry it; GitHub auto-masks token values in logs either way."
        required: false
        type: string
        default: ''
      ci-workflow:
        description: "CI workflow FILE NAME the SM dispatches on PR heads (dispatch-only CI: pushes fire no CI). Per-repo knob — e.g. 'quality.yml' (dmtools-dart) vs 'ci.yml' (fa). Rides jobParams.ciWorkflow into the SM engine."
        required: false
        type: string
        default: 'quality.yml'
      validation-checks:
        description: "Bridge-free mode (factory #510): the tick stamps these check names itself. JSON array as a STRING (e.g. '[\"agents-suite\",\"static\",\"gate\"]')."
        required: false
        type: string
        default: ''
      parallel-workers:
        description: "OPT-IN (dmtools Dart runtime only): runAsync worker-pool size for parallel READ fan-out inside the SM tick (per-PR/issue enrichment, dispatched-CI probes). '0'/absent = runAsync not wired — the engine takes its sequential fallback (Java/GraalJS parity), zero deviation. A value parsing to int >= 2 rides jobParams.parallelWorkers."
        required: false
        type: string
        default: '0'
      state-publish:
        description: "OPT-IN factory-state publishing (owner 2026-09-23): JSON object {channel:'release', repo?, tag?, asset?}. The tick uploads factory-state.json as a public prerelease asset; the board (site/factory) reads the releases/latest CDN link. Empty = off."
        required: false
        type: string
        default: ''
      scm-provider:
        description: "Forge the SM tick reconciles: 'github' (default — runs sm_github@latest against github.repository) or 'gitlab' (runs sm_gitlab@latest against gitlab-project; needs the GITLAB_TOKEN secret)."
        required: false
        type: string
        default: 'github'
      gitlab-project:
        description: "scm-provider=gitlab only: GitLab project path '<namespace>/<project>' (nested groups allowed, e.g. 'group/sub/project'). Split on the LAST '/' into jobParams.owner/repo."
        required: false
        type: string
        default: ''
      gitlab-base-path:
        description: "scm-provider=gitlab only: GitLab instance URL WITHOUT /api/v4 (dmtools GITLAB_BASE_PATH), e.g. 'https://gitlab.example.com'."
        required: false
        type: string
        default: 'https://gitlab.com'

# EXACTLY the set factory-sm.yml declares — mapping a secret the callee
# does not declare is rejected at call time, a missing declared one fails
# the guard test (factory_stub_ref_test.dart parity in each caller).
    secrets:
      SOURCE_GITHUB_TOKEN:
        description: "PAT for GitHub tool calls + gh CLI (SM engine + validation probes)."
        required: true
      SILENT_GH_TOKEN:
        description: "Optional dedicated silent-update token; the silent-token input wins when both are set."
        required: false
      APP_ID:
        description: 'Optional GitHub App id (awf#52). With APP_PRIVATE_KEY set, the tick rides a per-job App installation token (10x the PAT rate budget) instead of SOURCE_GITHUB_TOKEN. Absent => PAT, byte-identical to the pre-App behavior. NEVER used for SILENT_GH_TOKEN — silent update-branch pushes must keep a token that fires no events.'
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key (PEM) of the APP_ID GitHub App.'
        required: false
      GITLAB_TOKEN:
        description: "scm-provider=gitlab only: GitLab token (api scope) for the sm_gitlab tick's gitlab_* tool calls (dmtools GITLAB_TOKEN)."
        required: false

permissions:
  contents: write         # checkout + silent update-branch pushes
  issues: write           # labels + close-issue safety net
  pull-requests: write    # update-branch + merge
  checks: write           # bridge-free validation stamps (factory #510)
  actions: write          # workflow_dispatch on the teammate workflow

env:
  # Version knobs resolve from the CALLER's repository variables (vars.*
  # resolve in the caller's context for reusable workflows) — bumping an
  # agent/CLI version is a repo-settings edit, never a workflow edit.
  AGENTS_VERSION: ${{ vars.AGENTS_VERSION || 'latest' }}
  DMTOOLS_VERSION: ${{ vars.DMTOOLS_VERSION || 'latest' }}

jobs:
  sm:
    name: sm / reconcile
    runs-on: ${{ inputs.runner }}
    steps:
      # Fails BEFORE any install when the GitLab opt-in is half-wired.
      # scm-provider=github (default) resolves to exactly the pre-knob tick.
      - name: Resolve SM forge (github | gitlab)
        id: forge
        env:
          SCM_PROVIDER: ${{ inputs.scm-provider }}
          GITLAB_PROJECT: ${{ inputs.gitlab-project }}
          GITLAB_BASE_PATH: ${{ inputs.gitlab-base-path }}
          HAS_GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN != '' }}
        run: |
          provider="${SCM_PROVIDER:-github}"
          case "$provider" in
            github)
              echo "pack=sm_github" >> "$GITHUB_OUTPUT"
              ;;
            gitlab)
              project="${GITLAB_PROJECT#/}"
              project="${project%/}"
              case "$project" in
                */*) ;;
                *) echo "::error::scm-provider=gitlab needs gitlab-project '<namespace>/<project>' (got '${GITLAB_PROJECT}')"; exit 1 ;;
              esac
              if [ -z "$GITLAB_BASE_PATH" ]; then
                echo "::error::scm-provider=gitlab needs gitlab-base-path"; exit 1
              fi
              if [ "$HAS_GITLAB_TOKEN" != "true" ]; then
                echo "::error::scm-provider=gitlab needs the GITLAB_TOKEN secret mapped in the caller stub"; exit 1
              fi
              # Nested groups: namespace = everything before the LAST '/'.
              echo "pack=sm_gitlab" >> "$GITHUB_OUTPUT"
              echo "owner=${project%/*}" >> "$GITHUB_OUTPUT"
              echo "repo=${project##*/}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown scm-provider '${provider}' (expected 'github' or 'gitlab')"; exit 1
              ;;
          esac
          echo "scm provider: ${provider}"

      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          # The pack runner resolves .dmtools/config.js from the CWD —
          # the target repo root (machineAuthor, jira.fields, ...).
          ref: ${{ github.ref }}
          persist-credentials: false

      # GitHub App auth (awf#52): with APP_ID + APP_PRIVATE_KEY secrets,
      # the tick rides a per-job App installation token instead of the PAT
      # (the ai-teammate PAT's 5000 req/h budget was exhausted by SM ticks —
      # dmtools-agents run 39034080472). Minted HERE because GitHub strips
      # secret-bearing job outputs (tokens cannot cross jobs). Absent APP_*
      # secrets => SOURCE_GITHUB_TOKEN (PAT), byte-identical to today.
      - name: Resolve GitHub auth (App -> PAT)
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "auth: app"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "auth: pat"
          fi

      - name: Mint GitHub App installation token
        id: app-token
        if: steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve versions (agents release + dmtools CLI)
        # 'latest' resolves to the newest PUBLISHED release tag at tick
        # time; an explicit tag (e.g. vars.AGENTS_VERSION=agents-rel-…)
        # pins the tick reproducibly. Fails loudly when the tag does not
        # exist (gh api exits non-zero → red tick, no silent fallback).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          resolve_tag() {
            local repo="$1" knob="$2"
            if [ "$knob" = "latest" ]; then
              gh api "repos/${repo}/releases/latest" --jq .tag_name
            else
              # existence check — a typo'd pin must fail HERE, not in the tick
              gh api "repos/${repo}/releases/tags/${knob}" --jq .tag_name
            fi
          }
          AGENTS_TAG="$(resolve_tag IstiN/dmtools-agents "$AGENTS_VERSION")"
          DMTOOLS_TAG="$(resolve_tag epam/dmtools-dart "$DMTOOLS_VERSION")"
          echo "AGENTS_TAG=${AGENTS_TAG}" >> "$GITHUB_ENV"
          echo "DMTOOLS_TAG=${DMTOOLS_TAG}" >> "$GITHUB_ENV"
          echo "agents pack release: ${AGENTS_TAG} (knob: ${AGENTS_VERSION})"
          echo "dmtools CLI release: ${DMTOOLS_TAG} (knob: ${DMTOOLS_VERSION})"

      - name: Install dmtools CLI (release bundle)
        # The installer ships as a release asset, version-locked to the
        # bundle it installs — no copy of install.sh in the target repo.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          DMTOOLS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          if ! curl -fsSL --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              "https://github.com/epam/dmtools-dart/releases/download/${DMTOOLS_TAG}/install.sh" \
              -o /tmp/dmtools-install.sh; then
            echo "browser_download failed; falling back to GitHub Releases API for epam/dmtools-dart@${DMTOOLS_TAG}/install.sh" >&2
            ASSET_URL="$(gh api "repos/epam/dmtools-dart/releases/tags/${DMTOOLS_TAG}" --jq '.assets[] | select(.name == "install.sh") | .url')"
            curl -fsSL --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              -H "Accept: application/octet-stream" \
              ${GH_TOKEN:+-H "Authorization: Bearer ${GH_TOKEN}"} \
              "${ASSET_URL}" -o /tmp/dmtools-install.sh
          fi
          bash /tmp/dmtools-install.sh "${DMTOOLS_TAG}"
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Reconcile the machine loop
        # The SM engine runs as a VERSIONED AGENT PACK: sm_github@latest (or
        # sm_gitlab@latest when steps.forge picked GitLab) resolves the pack version from the release's catalog.json,
        # downloads <agent>-<version>.zip, verifies the sha256 sidecar +
        # the manifest's per-file inventory, and caches it under
        # ~/.dmtools/packs/. CWD stays the target repo root so the pack's
        # configLoader discovers .dmtools/config.js exactly like the old
        # submodule checkout did (rule 4 of its discovery order).
        env:
          # App installation token (awf#52, minted above) wins; absent APP_*
          # secrets => SOURCE_GITHUB_TOKEN (PAT), exactly as before.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # dmtools reads SOURCE_GITHUB_TOKEN (env-parity with Java); without
          # it the GitHub integration counts as unconfigured and the JS
          # runtime does not expose github_* globals at all.
          SOURCE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          # github.token does NOT cross the reusable-call boundary through
          # inputs or secrets (live-verified BOTH arrive empty) — but a
          # called workflow can reference its OWN github.token directly:
          # same repo, same run, pushes with it trigger no workflows.
          SILENT_GH_TOKEN: ${{ inputs.silent-token || secrets.SILENT_GH_TOKEN || github.token }}
          # Check-run API calls (POST/PATCH /check-runs) require a GitHub App
          # token (github.token, integration_id 15368) — a PAT in SILENT_GH_TOKEN
          # gets HTTP 403 "You must authenticate via a GitHub App".
          CHECKS_GH_TOKEN: ${{ github.token }}
          # scm-provider=gitlab: dmtools' GitLab integration (gitlab_* JS
          # globals) reads these; empty on a GitHub tick (integration off).
          GITLAB_TOKEN: ${{ steps.forge.outputs.pack == 'sm_gitlab' && secrets.GITLAB_TOKEN || '' }}
          GITLAB_BASE_PATH: ${{ steps.forge.outputs.pack == 'sm_gitlab' && inputs.gitlab-base-path || '' }}
          GITLAB_WORKSPACE: ${{ steps.forge.outputs.owner }}
          GITLAB_REPOSITORY: ${{ steps.forge.outputs.repo }}
          SM_PACK: ${{ steps.forge.outputs.pack }}
          # Registry base = the resolved agents release's asset URL
          # directory: <base>/catalog.json maps agent→version, packs and
          # their .sha256 sidecars live at <base>/<name>-<version>.zip.
        run: |
          export DMTOOLS_PACK_REGISTRY="https://github.com/IstiN/dmtools-agents/releases/download/${AGENTS_TAG}"
          repo='${{ github.repository }}'
          target="\"repo\":\"${repo}\""
          gh_only=true
          if [ "$SM_PACK" = "sm_gitlab" ]; then
            # GitLab tick: the project rides jobParams.owner/repo (owner may
            # be a nested group path). GitHub-only lanes are disabled in
            # sm_gitlab, so their jobParams are not passed.
            target="\"owner\":\"${GITLAB_WORKSPACE}\",\"repo\":\"${GITLAB_REPOSITORY}\""
            gh_only=false
          fi
          # #687: silentToken powers update_branch localActions (github.token
          # pushes trigger no workflows); sourceToken restores the PAT after.
          extra=""
          if [ "$gh_only" = true ] && [ -n "$SILENT_GH_TOKEN" ]; then
            extra=",\"silentToken\":\"${SILENT_GH_TOKEN}\",\"sourceToken\":\"${SOURCE_GITHUB_TOKEN}\""
          fi
          if [ "$gh_only" = true ] && [ -n "$CHECKS_GH_TOKEN" ]; then
            extra="${extra},\"checksToken\":\"${CHECKS_GH_TOKEN}\""
          fi
          # #687: machine login is deployment-level (never hardcoded in the
          # agents repo) — jobParams.machineAuthor / config.machineAuthor.
          ma='${{ inputs.machine-author }}'
          if [ -n "$ma" ]; then
            extra="${extra},\"machineAuthor\":\"${ma}\""
          fi
          # Dispatch-only CI: which workflow file the SM runs on PR heads.
          cw='${{ inputs.ci-workflow }}'
          if [ "$gh_only" = true ] && [ -n "$cw" ]; then
            extra="${extra},\"ciWorkflow\":\"${cw}\""
          fi
          # Bridge-free mode: check names the tick stamps itself (JSON
          # array as a STRING jobParam — escaped for the override JSON).
          vc='${{ inputs.validation-checks }}'
          if [ "$gh_only" = true ] && [ -n "$vc" ]; then
            vc_escaped=$(printf '%s' "$vc" | sed 's/"/\\"/g')
            extra="${extra},\"validationChecks\":\"${vc_escaped}\""
          fi
          # Factory-state publishing (owner 2026-09-23, OPT-IN): JSON object
          # {channel:'release', repo?, tag?, asset?}. Empty = off. The tick
          # uploads a factory-state.json snapshot as a release asset; the
          # board reads the public CDN link (no tokens, no rate limits).
          sp='${{ inputs.state-publish }}'
          if [ "$gh_only" = true ] && [ -n "$sp" ]; then
            sp_escaped=$(printf '%s' "$sp" | sed 's/"/\\"/g')
            extra="${extra},\"statePublish\":\"${sp_escaped}\""
          fi
          # Parallel read fan-out (OPT-IN, dmtools Dart runtime only): a
          # value parsing to int >= 2 wires the runAsync worker pool into
          # the SM engine (parallel enrichment/probes). '0'/absent =
          # sequential fallback — the override gains nothing, exactly like
          # the pre-knob behavior.
          pw='${{ inputs.parallel-workers }}'
          if [ -n "$pw" ]; then
            pw_int=$(printf '%s' "$pw" | grep -E '^[0-9]+$' || true)
            if [ -n "$pw_int" ] && [ "$pw_int" -ge 2 ]; then
              extra="${extra},\"parallelWorkers\":${pw_int}"
            fi
          fi
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            override="{\"params\":{\"jobParams\":{${target},\"dryRun\":true${extra}}}}"
          else
            override="{\"params\":{\"jobParams\":{${target}${extra}}}}"
          fi
          dmtools run "${SM_PACK}@latest" "$override"
