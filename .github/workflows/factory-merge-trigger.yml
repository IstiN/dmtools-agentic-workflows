# Factory Merge Trigger — the canonical pr_approved merge bot.
#
# One reusable implementation for every factory repo. The calling repo
# keeps a thin stub that declares the EVENT triggers (workflow_run on its
# CI workflow, optionally issues:labeled) and calls this one — `on:` in a
# stub cannot be parameterized, everything below the event boundary is
# shared here.
#
# The tracker is the CALLING repo's GitHub issues (no Jira, no external
# services):
#
#   issue labeled `pr_approved` → linked PR found → required checks green
#   (branch protection is the gate: mergeStateStatus CLEAN) → squash-merge
#   → label removed → comment posted on the issue.
#
# Linking conventions (any of):
#   - PR body contains `Closes #NN` / `Fixes #NN` / `Resolves #NN`
#   - PR body contains `Part of #NN` (link WITHOUT close — GitHub never
#     auto-closes on "Part of", the epic survives the slice merge)
#   - PR branch name starts with `NN-` (e.g. `42-fix-foo`)
#   - PR branch name matches `gh-0*NN` (the gh-N display-title convention)
#   - the PR itself carries the label (pr_review approves via
#     scm.addLabel) — mapped back to its linked issue; a labeled PR with
#     NO resolvable issue merges directly (PR-carrier path: fix/*,
#     chore/*, machine PRs)
#
# The sweep logic lives in the dmtools-agents pack (merge_trigger.json →
# agents/js/mergeTrigger.js, agents#754): structured github_* bridge
# calls, no bash text parsing. This workflow is only the dmtools-run
# WRAPPER — version knobs resolve from the CALLER's repository variables
# (vars.AGENTS_VERSION / vars.DMTOOLS_VERSION, 'latest' default), same
# freeze contract as factory-merge.yml / factory-sm.yml.
#
# Prerequisites (in the calling repo):
#   vars: MERGE_TRIGGER_ENABLED (fuse — the job skips itself until `true`)
#   branch protection on main with required checks + strict (the machine
#   only merges CLEAN PRs, so protection defines what "ready" means).
#   optional: .dmtools/config.js on the default branch — fetched into the
#   job CWD so per-repo knobs (machineAuthor, reviewPolicy, jira.fields,
#   ...) reach the sweep; absent = jobParams-only legacy behavior (empty
#   machine allowlist = gh-744 "everything human" semantics continue).
#   github.token is sufficient for everything; pass a PAT via
#   secrets: inherit if the caller needs one (see GH_TOKEN below).

name: Factory Merge Trigger

run-name: 'Merge Trigger : CI passed → merge pr_approved issues'

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runs-on label for the merge job'
        type: string
        default: 'ubuntu-slim'
      remove_pr_label:
        description: 'Also remove pr_approved from the merged PR (dmd convention)'
        type: boolean
        default: true
      map_pr_labels:
        description: 'Map PRs labeled pr_approved back to their linked issues'
        type: boolean
        default: true
      gh_branch_pattern:
        description: 'Also link via branch names like gh-0*NN'
        type: boolean
        default: true
    secrets:
      APP_ID:
        description: 'Optional GitHub App id (awf#52). With APP_PRIVATE_KEY set, the sweep rides a per-job App installation token instead of PAT_TOKEN/github.token. Absent => byte-identical to the pre-App behavior.'
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key (PEM) of the APP_ID GitHub App.'
        required: false
      PAT_TOKEN:
        description: 'Optional PAT (repo scope) — wins over github.token when no App secrets are set.'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  # Version knobs resolve from the CALLER's repository variables (vars.*
  # resolve in the caller's context for reusable workflows).
  AGENTS_VERSION: ${{ vars.AGENTS_VERSION || 'latest' }}
  DMTOOLS_VERSION: ${{ vars.DMTOOLS_VERSION || 'latest' }}

jobs:
  merge-trigger:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    # Same-repo guard: PRs from forks must not trigger merges. The
    # issues:labeled entry path (dmd) re-enters without a workflow_run.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'pr_approved') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: merge-trigger-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Gate on MERGE_TRIGGER_ENABLED
        id: gate
        env:
          ENABLED: ${{ vars.MERGE_TRIGGER_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::merge-trigger scaffold is wired but disabled — set the MERGE_TRIGGER_ENABLED repo variable to true (after branch protection + required checks are in place)."
          fi

      # GitHub App auth (awf#52): with APP_ID + APP_PRIVATE_KEY secrets the
      # sweep rides a per-job App installation token; absent them the
      # PAT_TOKEN -> github.token chain below is byte-identical to today.
      # Minted in-job: GitHub strips secret-bearing job outputs.
      - name: Resolve GitHub auth (App -> PAT -> github.token)
        id: app
        if: steps.gate.outputs.enabled == 'true'
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "auth: app"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "auth: pat"
          fi

      - name: Mint GitHub App installation token
        id: app-token
        if: steps.gate.outputs.enabled == 'true' && steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve versions (agents release + dmtools CLI)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PAT_TOKEN || github.token }}
        run: |
          resolve_tag() {
            local repo="$1" knob="$2"
            if [ "$knob" = "latest" ]; then
              gh api "repos/${repo}/releases/latest" --jq .tag_name
            else
              gh api "repos/${repo}/releases/tags/${knob}" --jq .tag_name
            fi
          }
          AGENTS_TAG="$(resolve_tag IstiN/dmtools-agents "$AGENTS_VERSION")"
          DMTOOLS_TAG="$(resolve_tag epam/dmtools-dart "$DMTOOLS_VERSION")"
          echo "AGENTS_TAG=${AGENTS_TAG}" >> "$GITHUB_ENV"
          echo "DMTOOLS_TAG=${DMTOOLS_TAG}" >> "$GITHUB_ENV"
          echo "agents pack release: ${AGENTS_TAG} (knob: ${AGENTS_VERSION})"
          echo "dmtools CLI release: ${DMTOOLS_TAG} (knob: ${DMTOOLS_VERSION})"

      - name: Install dmtools CLI (release bundle)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          DMTOOLS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          if ! curl -fsSL --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              "https://github.com/epam/dmtools-dart/releases/download/${DMTOOLS_TAG}/install.sh" \
              -o /tmp/dmtools-install.sh; then
            echo "browser_download failed; falling back to GitHub Releases API for epam/dmtools-dart@${DMTOOLS_TAG}/install.sh" >&2
            ASSET_URL="$(gh api "repos/epam/dmtools-dart/releases/tags/${DMTOOLS_TAG}" --jq '.assets[] | select(.name == "install.sh") | .url')"
            curl -fsSL --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              -H "Accept: application/octet-stream" \
              ${GH_TOKEN:+-H "Authorization: Bearer ${GH_TOKEN}"} \
              "${ASSET_URL}" -o /tmp/dmtools-install.sh
          fi
          bash /tmp/dmtools-install.sh "${DMTOOLS_TAG}"
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      # The funnel is otherwise CONFIG-BLIND: the sweep runs checkout-less,
      # so configLoader.loadProjectConfig() can only see files in the job
      # CWD (candidate '.dmtools/config.js', js/configLoader.js
      # buildConfigCandidates) and every per-repo knob — machineAuthor,
      # reviewPolicy, jira.fields, ... — is invisible. Live hole
      # (IstiN/dmtools-agents PR #1410, 2026-11-09): the gh-1353/gh-1370
      # merge backstop's machine-allowlist resolved EMPTY (documented
      # fail-open: "unconfigured = NOTHING counts as machine-owned"),
      # the bot's own review thread was classified human ("1 open human
      # thread(s) stay per gh-744") and the PR merged with an open machine
      # review thread.
      # What this reads: ONE file, `.dmtools/config.js`, from the CALLER
      # repo's default branch, at merge time (live, unpinned — same
      # semantics as factory-sm.yml's target-repo-root read); evaluated by
      # the engine's sandboxed config loader (no require, no shell exec).
      # Fail-open: absent/failed/empty/HTML = legacy jobParams-only
      # behavior (byte-identical); loadConfigFile catches evaluation
      # errors -> defaults.
      # TRUST NOTE: the fetched config is CALLER-controlled (a commit to
      # the caller's default branch can add machineAuthor entries); listed
      # logins' open review threads are then auto-resolved by the merge
      # gate (gh-744 keeps human threads untouched). Same trust model as
      # factory-sm.yml's target-repo-root read — governed by the same
      # branch protection that gates merges on that branch.
      # Scope note (factory doctrine): this workflow is GitHub-only today
      # (workflow_run/issues events, gh CLI, github_* bridge) — the read
      # deliberately rides the SAME gh CLI + token chain as every other
      # step (no raw.githubusercontent host dependency). The SCM-agnostic
      # endgame — configLoader fetching through the scm layer (github/
      # gitlab twins) instead of any workflow bash — is tracked as a
      # follow-up issue; this step is the stopgap that must not hardcode
      # non-API hosts.
      - name: Fetch the caller repo's .dmtools/config.js into CWD
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PAT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .dmtools
          # Canonical REST read (gh api, default branch, same auth chain as
          # the merge itself). ANY gh failure — 404, auth, rate limit, 5xx,
          # network — exits non-zero and takes the same fail-open path.
          if ! gh api "repos/${REPO}/contents/.dmtools/config.js" \
               --jq '.content' > /tmp/repo-config.b64 2>/dev/null; then
            echo "::warning::gh api read of .dmtools/config.js failed or the file is absent — the funnel runs with jobParams-only (legacy behavior)"
            exit 0
          fi
          if ! base64 -d /tmp/repo-config.b64 > /tmp/repo-config.js 2>/dev/null; then
            echo "::warning::config decode failed — the funnel runs with jobParams-only (legacy behavior)"
            exit 0
          fi
          if [ ! -s /tmp/repo-config.js ]; then
            echo "::warning::config decode came back empty — the funnel runs with jobParams-only (legacy behavior)"
            exit 0
          fi
          if grep -qi '<html\|<!DOCTYPE' /tmp/repo-config.js; then
            echo "::warning::fetched config looks like an HTML error page — ignoring (legacy behavior)"
            exit 0
          fi
          mv /tmp/repo-config.js .dmtools/config.js
          echo "config fetched: .dmtools/config.js ($(wc -c < .dmtools/config.js) bytes)"

      - name: Merge issues labeled pr_approved
        if: steps.gate.outputs.enabled == 'true'
        # Runs as a VERSIONED AGENT PACK (merge_trigger@latest): the pack
        # carries mergeTrigger.js + merge_trigger.json, sha256-verified
        # against the release catalog. NO checkout — the sweep is pure
        # GitHub API via the github_* tool bridge; the workflow inputs map
        # into the jobParams override.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PAT_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.PAT_TOKEN || github.token }}
          SOURCE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.PAT_TOKEN || github.token }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          export DMTOOLS_PACK_REGISTRY="https://github.com/IstiN/dmtools-agents/releases/download/${AGENTS_TAG}"
          repo='${{ github.repository }}'
          override=$(cat <<EOF
          {"params":{"jobParams":{"repo":"${repo}","label":"pr_approved","mapPrLabels":${{ inputs.map_pr_labels }},"ghBranchPattern":${{ inputs.gh_branch_pattern }},"removePrLabel":${{ inputs.remove_pr_label }},"ciRunUrl":"${CI_RUN_URL}"}}}
          EOF
          )
          dmtools run merge_trigger@latest "$override"
