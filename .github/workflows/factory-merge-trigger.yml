# Factory Merge Trigger — the canonical pr_approved merge bot.
#
# One reusable implementation for every factory repo. The calling repo
# keeps a thin stub that declares the EVENT triggers (workflow_run on its
# CI workflow, optionally issues:labeled) and calls this one — `on:` in a
# stub cannot be parameterized, everything below the event boundary is
# shared here.
#
# The tracker is the CALLING repo's GitHub issues (no Jira, no external
# services):
#
#   issue labeled `pr_approved` → linked PR found → required checks green
#   (branch protection is the gate: mergeStateStatus CLEAN) → squash-merge
#   → label removed → comment posted on the issue.
#
# Linking conventions (any of):
#   - PR body contains `Closes #NN` / `Fixes #NN` / `Resolves #NN`
#   - PR body contains `Part of #NN` (link WITHOUT close — GitHub never
#     auto-closes on "Part of", the epic survives the slice merge)
#   - PR branch name starts with `NN-` (e.g. `42-fix-foo`)
#   - PR branch name matches `gh-0*NN` (the gh-N display-title convention)
#   - the PR itself carries the label (pr_review approves via
#     scm.addLabel) — mapped back to its linked issue; a labeled PR with
#     NO resolvable issue merges directly (PR-carrier path: fix/*,
#     chore/*, machine PRs)
#
# The sweep logic lives in the dmtools-agents pack (merge_trigger.json →
# agents/js/mergeTrigger.js, agents#754): structured github_* bridge
# calls, no bash text parsing. This workflow is only the dmtools-run
# WRAPPER — version knobs resolve from the CALLER's repository variables
# (vars.AGENTS_VERSION / vars.DMTOOLS_VERSION, 'latest' default), same
# freeze contract as factory-merge.yml / factory-sm.yml.
#
# Prerequisites (in the calling repo):
#   vars: MERGE_TRIGGER_ENABLED (fuse — the job skips itself until `true`)
#   branch protection on main with required checks + strict (the machine
#   only merges CLEAN PRs, so protection defines what "ready" means).
#   github.token is sufficient for everything; pass a PAT via
#   secrets: inherit if the caller needs one (see GH_TOKEN below).

name: Factory Merge Trigger

run-name: 'Merge Trigger : CI passed → merge pr_approved issues'

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runs-on label for the merge job'
        type: string
        default: 'ubuntu-latest'
      remove_pr_label:
        description: 'Also remove pr_approved from the merged PR (dmd convention)'
        type: boolean
        default: true
      map_pr_labels:
        description: 'Map PRs labeled pr_approved back to their linked issues'
        type: boolean
        default: true
      gh_branch_pattern:
        description: 'Also link via branch names like gh-0*NN'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  # Version knobs resolve from the CALLER's repository variables (vars.*
  # resolve in the caller's context for reusable workflows).
  AGENTS_VERSION: ${{ vars.AGENTS_VERSION || 'latest' }}
  DMTOOLS_VERSION: ${{ vars.DMTOOLS_VERSION || 'latest' }}

jobs:
  merge-trigger:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    # Same-repo guard: PRs from forks must not trigger merges. The
    # issues:labeled entry path (dmd) re-enters without a workflow_run.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'pr_approved') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: merge-trigger-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Gate on MERGE_TRIGGER_ENABLED
        id: gate
        env:
          ENABLED: ${{ vars.MERGE_TRIGGER_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::merge-trigger scaffold is wired but disabled — set the MERGE_TRIGGER_ENABLED repo variable to true (after branch protection + required checks are in place)."
          fi

      - name: Resolve versions (agents release + dmtools CLI)
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          resolve_tag() {
            local repo="$1" knob="$2"
            if [ "$knob" = "latest" ]; then
              gh api "repos/${repo}/releases/latest" --jq .tag_name
            else
              gh api "repos/${repo}/releases/tags/${knob}" --jq .tag_name
            fi
          }
          AGENTS_TAG="$(resolve_tag IstiN/dmtools-agents "$AGENTS_VERSION")"
          DMTOOLS_TAG="$(resolve_tag epam/dmtools-dart "$DMTOOLS_VERSION")"
          echo "AGENTS_TAG=${AGENTS_TAG}" >> "$GITHUB_ENV"
          echo "DMTOOLS_TAG=${DMTOOLS_TAG}" >> "$GITHUB_ENV"
          echo "agents pack release: ${AGENTS_TAG} (knob: ${AGENTS_VERSION})"
          echo "dmtools CLI release: ${DMTOOLS_TAG} (knob: ${DMTOOLS_VERSION})"

      - name: Install dmtools CLI (release bundle)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl -fsSL "https://github.com/epam/dmtools-dart/releases/download/${DMTOOLS_TAG}/install.sh" \
            -o /tmp/dmtools-install.sh
          bash /tmp/dmtools-install.sh "${DMTOOLS_TAG}"
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Merge issues labeled pr_approved
        if: steps.gate.outputs.enabled == 'true'
        # Runs as a VERSIONED AGENT PACK (merge_trigger@latest): the pack
        # carries mergeTrigger.js + merge_trigger.json, sha256-verified
        # against the release catalog. NO checkout — the sweep is pure
        # GitHub API via the github_* tool bridge; the workflow inputs map
        # into the jobParams override.
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          export DMTOOLS_PACK_REGISTRY="https://github.com/IstiN/dmtools-agents/releases/download/${AGENTS_TAG}"
          repo='${{ github.repository }}'
          override=$(cat <<EOF
          {"params":{"jobParams":{"repo":"${repo}","label":"pr_approved","mapPrLabels":${{ inputs.map_pr_labels }},"ghBranchPattern":${{ inputs.gh_branch_pattern }},"removePrLabel":${{ inputs.remove_pr_label }},"ciRunUrl":"${CI_RUN_URL}"}}}
          EOF
          )
          dmtools run merge_trigger@latest "$override"
